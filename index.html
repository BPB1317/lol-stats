<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Thème choisi (ou celui du système) appliqué avant l'affichage : pas de flash
      try {
        var t = localStorage.getItem('bpb-theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squawo x Kelicful</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
